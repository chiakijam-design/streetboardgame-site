name: Automated game tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run build
      - run: pnpm run check:translations
      - run: pnpm run test:unit
      - name: Existing game and site regressions
        id: existing_regressions
        run: pnpm exec playwright test --grep-invert 'completed multilingual release'
      - name: All locale desktop and mobile flows
        if: success() || steps.existing_regressions.conclusion == 'failure'
        run: pnpm exec playwright test tests/e2e/multilingual.spec.mjs --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
